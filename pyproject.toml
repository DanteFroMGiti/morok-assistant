[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morok-assistant"
version = "0.3.1"
description = "Modular desktop character and future system assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
art = ["Pillow>=11.0"]

[project.scripts]
morok-assistant = "morok_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morok_assistant = [
    "assets/*.png",
    "assets/*.txt",
    "assets/characters/*/*.json",
    "assets/characters/*/sprites-v5.png",
    "assets/kwin/*/*.json",
    "assets/kwin/*/contents/code/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
